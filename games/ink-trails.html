function moverOff(m,t){ return m.amp*Math.sin(m.speed*t+m.phase); }
function moverVel(m,t){ return m.amp*m.speed*Math.cos(m.speed*t+m.phase); }
function dynSegs(lv,t){
  var out=[], i,j;
  for(i=0;i<lv.segs.length;i++){ var s=lv.segs[i];
    out.push({x1:s.x1,y1:s.y1,x2:s.x2,y2:s.y2,pvx:0,pvy:0,kind:s.kind}); }
  for(i=0;i<(lv.movers||[]).length;i++){ var m=lv.movers[i];
    var o=moverOff(m,t), v=moverVel(m,t);
    var vx=m.axis==='x'?v:0, vy=m.axis==='y'?v:0;
    for(j=0;j<m.segs.length;j++){ var d=m.segs[j];
      var ox=m.axis==='x'?o:0, oy=m.axis==='y'?o:0;
      out.push({x1:m.bx+d.dx1+ox, y1:m.by+d.dy1+oy,
               x2:m.bx+d.dx2+ox, y2:m.by+d.dy2+oy, pvx:vx, pvy:vy, kind:'mover'}); } }
  for(i=0;i<(lv.spinners||[]).length;i++){ var sp=lv.spinners[i];
    var a=sp.phase+sp.speed*t, L=sp.len/2;
    var hx=Math.cos(a)*L, hy=Math.sin(a)*L;
    out.push({x1:sp.cx-hx, y1:sp.cy-hy, x2:sp.cx+hx, y2:sp.cy+hy,
      pvx:-hy*sp.speed, pvy:hx*sp.speed, kind:'spike'}); }
  return out;
}
function solveSeg(b,s){
  var dx=s.x2-s.x1, dy=s.y2-s.y1, l2=dx*dx+dy*dy||1e-9;
  var t=clamp(((b.x-s.x1)*dx+(b.y-s.y1)*dy)/l2,0,1);
  var cx=s.x1+t*dx, cy=s.y1+t*dy;
  var ddx=b.x-cx, ddy=b.y-cy, d=Math.hypot(ddx,ddy);

  if(d<1e-4){ ddx=0; ddy=-1; d=1; } else { ddx/=d; ddy/=d; }
  b.x=cx+ddx*R; b.y=cy+ddy*R;
  var pvx=s.pvx||0, pvy=s.pvy||0;
  var rvx=b.vx-pvx, rvy=b.vy-pvy;
  var vn=rvx*ddx+rvy*ddy;
  if(vn>=0) return 0;
  var e,fr;
  if(s.kind==='pad'){ e=1.05; fr=0.75; }
  else if(s.kind==='mover'){ e=0.15; fr=0.93; }
  else { e=0.24; fr=0.9985; }
  var vn2=-e*vn;
  var tx=-ddy, ty=ddx;

}

  function recomputeInk(){
    var l=0;
    for(var i=0;i<strokes.length;i++){ var p=strokes[i];
      for(var j=1;j<p.length;j++) l+=Math.hypot(p[j].x-p[j-1].x,p[j].y-p[j-1].y); }

  cv.addEventListener('pointermove', function(e){
    if(drawing===null || e.pointerId!==drawingId) return;

    var d=Math.hypot(p.x-last.x,p.y-last.y);

    if(d>remain){ var f=remain/d; p={x:last.x+(p.x-last.x)*f, y:last.y+(p.y-last.y)*f}; d=remain; }
    if(d<1){ return; }

    syncHud();
  });

    ctx.beginPath(); ctx.moveTo(0,H+30);
    for(var x=0;x<=W;x+=16) ctx.lineTo(x, 380+Math.sin(x*0.006+1.3)*42+Math.sin(x*0.017)*16);
    ctx.lineTo(W,H+30); ctx.fill();

  function drawWorld(t){
    var lv=LEVELS[lvlIdx];

      g.addColorStop(1,'rgba(200,240,235,0.05)');

      ctx.strokeStyle='rgba(225,250,245,0.5)'; ctx.lineWidth=3; ctx.lineCap='round';
      for(var k=0;k<5;k++){ var yy=f.y+f.h - (((t*90 + k*75) % (f.h+60)) - 30);
        var cx=f.x+f.w/2 + Math.sin(t*2+k)*14;
        if(yy>f.y+8 && yy<f.y+f.h-8){

        var dx=s.x2-s.x1, dy=s.y2-s.y1, L=Math.hypot(dx,dy)||1;

        for(var wx=-20; wx<=20; wx+=40){

        ctx.restore();

        ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(m.bx+o,m.by+22,50,0,6.283); ctx.fill();

        ctx.shadowColor='rgba(192,75,92,0.6)'; ctx.shadowBlur=6;

        ctx.strokeStyle='#2fb8a6'; ctx.lineWidth=11;
        ctx.shadowColor='rgba(60,220,200,0.7)'; ctx.shadowBlur=16;

        ctx.strokeStyle='#453f58'; ctx.lineWidth=13;
        line(w.x1,w.y1,w.x2,w.y2);
        var ddx=w.x2-w.x1, ddy=w.y2-w.y1, LL=Math.hypot(ddx,ddy)||1;

    ctx.strokeStyle='rgba(120,95,60,0.9)'; ctx.lineWidth=2.5;

  function drawBall(t){

      var bob=Math.sin(t*2.2)*3.5;

  function drawFx(dt,t){
    if(mode==='flying'){ trail.push({x:st.x,y:st.y,a:1});
      if(Math.random()<0.5) particles.push({x:st.x+(Math.random()-.5)*6,y:st.y+(Math.random()-.5)*6,
        vx:0,vy:0,life:0.35,age:0,c:'255,205,130',s:1.6}); }
    for(var i=trail.length-1;i>=0;i--){ trail[i].a-=dt*2.6;
      if(trail[i].a<=0) trail.splice(i,1); }
    for(i=0;i<trail.length;i++){ var tr=trail[i];
      ctx.fillStyle='rgba(255,195,110,'+(tr.a*0.4).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(tr.x,tr.y,R*tr.a*0.8,0,6.283); ctx.fill(); }
    for(i=particles.length-1;i>=0;i--){ var p=particles[i];
      p.age+=dt; if(p.age>=p.life){ particles.splice(i,1); continue; }
      p.vy+=260*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      var a=1-p.age/p.life;
      ctx.fillStyle='rgba('+p.c+','+(a*0.85).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.s*a+0.4,0,6.283); ctx.fill(); }
  }
  var acc=0, last=performance.now();

    var t=now/1000;
    ctx.setTransform(1,0,0,1,0,0);
    if(shakeT>0){ shakeT-=dt;
      var env=Math.max(0,shakeT/0.35);
      shX=(Math.random()-0.5)*shakeMag*env*2; shY=(Math.random()-0.5)*shakeMag*env*2; }
    else { shX=0; shY=0; }
    ctx.translate(shX, shY);
    drawSky(t);
    if(mode!=='title') drawWorld(t);
    drawBall(t);
    drawFx(dt,t);
    ctx.setTransform(1,0,0,1,0,0);
    if(flash>0){ flash-=dt;
      ctx.fillStyle='rgba('+flashColor+','+(Math.max(0,flash)*0.8).toFixed(3)+')';
      ctx.fillRect(0,0,W,H); }
    if(mode==='flying'){
      acc+=dt; var sdt=1/240;
      while(acc>1/240 && mode==='flying'){ step(st,LEVELS[lvlIdx],drawnSegs(),sdt); acc-=sdt; onEvent(); syncHud(); }
    }
    if(mode==='dying'){ respawnT-=dt;
      if(respawnT<=0){ newBall(); mode='ready'; syncHud(); } }
    if(hintT>0){ hintT-=dt; if(hintT<=0){ document.getElementById('hint').style.opacity=0; } }
    requestAnimationFrame(frame);
  }
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
