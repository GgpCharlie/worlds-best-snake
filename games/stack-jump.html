                        <body>
                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; align-items: center;
  }

  #score {
    margin-top: 30px; font-size: 48px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 2px;
    transition: transform 0.1s;
  }
  #score.pop { transform: scale(1.3); }

  #lives {
    margin-top: 8px; font-size: 28px; letter-spacing: 4px;
  }

  #message {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: auto;
  }

  #message h1 {
    font-size: 52px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 10px;
  }

  #message .sub {
    font-size: 20px; color: rgba(255,255,255,0.7); margin-bottom: 30px;
  }

  #fallIndicator {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0));
    border-radius: 4px; opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  #fallIndicator.active {
    opacity: 1;
  }

  #message button {
    padding: 16px 48px; font-size: 22px; font-weight: 700;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; box-shadow: 0 6px 25px rgba(102,126,234,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: auto;
  }
  #message button:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(102,126,234,0.7); }
  #message button:active { transform: scale(0.97); }

  #combo {
    position: absolute; top: 100px; right: 30px;
    font-size: 24px; font-weight: 700; color: #ffd700;
    text-shadow: 0 2px 10px rgba(255,215,0,0.5);
    opacity: 0; transition: opacity 0.3s;
  }
  #combo.show { opacity: 1; }

  #highScore {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 16px; color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="score">0</div>
  <div id="lives"></div>
  <div id="combo"></div>
  <div id="highScore"></div>
  <div id="fallIndicator"></div>
  <div id="message">
    <h1>STACK JUMP</h1>
    <div class="sub">Hold to fall through rings</div>
    <button id="startBtn">PLAY</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── AUDIO ENGINE (Web Audio API, no external files) ───
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() { if (!audioCtx) audioCtx = new AudioCtx(); }

function playTone(freq, duration, type='sine', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playBounce()  { playTone(440, 0.08, 'sine', 0.12); }
function playCrash()   { playTone(120, 0.25, 'sawtooth', 0.18); playTone(80, 0.3, 'square', 0.1); }
function playLifeLoss(){ playTone(300, 0.15, 'sine', 0.15); setTimeout(()=>playTone(200, 0.2, 'sine', 0.12), 100); }
function playGameOver(){ playTone(250, 0.3, 'sawtooth', 0.2); setTimeout(()=>playTone(180, 0.4, 'sawtooth', 0.18), 200); setTimeout(()=>playTone(100, 0.5, 'sawtooth', 0.15), 400); }
function playCombo(n)  { playTone(500 + n * 80, 0.12, 'sine', 0.13); }
function playSafe()    { playTone(660, 0.1, 'sine', 0.08); }

// ─── GAME CONSTANTS ───
const RING_RADIUS    = 3;
const RING_THICKNESS = 0.6;
const RING_HEIGHT    = 0.35;
const BALL_RADIUS    = 0.45;
const GRAVITY        = 45;
const FALL_SPEED     = 8;     // downward speed when holding
const ROTATION_SPEED = 1.2;   // radians per second
const LIVES          = 3;
const SAFE_RATIO     = 0.75;  // 75% safe, 25% danger

// ─── COLORS ───
const SAFE_COLOR = 0x4ade80;
const DANGER_COLOR = 0xef4444;

// ─── THREE.JS SETUP ───
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a1a2e);
document.body.prepend(renderer.domElement);

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const pointLight = new THREE.PointLight(0x667eea, 0.6, 20);
pointLight.position.set(0, 5, 0);
scene.add(pointLight);

// Camera position
camera.position.set(0, 6, 10);
camera.lookAt(0, 2, 0);

// ─── GAME STATE ───
let rings = [];
let ball;
let ballVelocity = 0;
let ballOnRingIndex = 0;
let score = 0;
let livesLeft = LIVES;
let combo = 0;
let gameState = 'menu'; // menu, playing, gameover
let highScore = parseInt(localStorage.getItem('stackJumpHigh') || '0');
let cameraTargetY = 6;
let shakeAmount = 0;
let isHolding = false;     // whether user is holding touch/click
let falling = false;       // whether ball is currently falling
let nextRingToCheck = 0;   // which ring index to check next during fall

// ─── RING CREATION ───
function createRingGeometry(radius, innerRadius, thickness, arcStart, arcEnd) {
  // Create a ring segment using RingGeometry
  const shape = new THREE.Shape();
  const segments = 64;
  const startAngle = arcStart;
  const endAngle = arcEnd;

  // Outer arc
  for (let i = 0; i <= segments; i++) {
    const angle = startAngle + (endAngle - startAngle) * (i / segments);
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  // Inner arc (reverse)
  for (let i = segments; i >= 0; i--) {
    const angle = startAngle + (endAngle - startAngle) * (i / segments);
    const x = Math.cos(angle) * innerRadius;
    const y = Math.sin(angle) * innerRadius;
    shape.lineTo(x, y);
  }
  shape.closePath();

  const extrudeSettings = { depth: thickness, bevelEnabled: false };
  const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geometry.rotateX(-Math.PI / 2);
  return geometry;
}

function createRing(y, safeStartAngle, safeLength) {
  const group = new THREE.Group();
  group.position.y = y;

  const innerRadius = RING_RADIUS * 0.55;
  const outerRadius = RING_RADIUS;

  // Safe segment (always green)
  const safeEnd = safeStartAngle + safeLength;
  const safeGeo = createRingGeometry(outerRadius, innerRadius, RING_HEIGHT, safeStartAngle, safeEnd);
  const safeMat = new THREE.MeshPhongMaterial({
    color: SAFE_COLOR,
    shininess: 80,
    specular: 0x444444,
  });
  const safeMesh = new THREE.Mesh(safeGeo, safeMat);
  safeMesh.castShadow = true;
  safeMesh.receiveShadow = true;
  group.add(safeMesh);

  // Danger segment (always red)
  const dangerStart = safeEnd;
  const dangerEnd = safeStartAngle + Math.PI * 2;
  const dangerGeo = createRingGeometry(outerRadius, innerRadius, RING_HEIGHT, dangerStart, dangerEnd);
  const dangerMat = new THREE.MeshPhongMaterial({
    color: DANGER_COLOR,
    shininess: 80,
    specular: 0x444444,
  });
  const dangerMesh = new THREE.Mesh(dangerGeo, dangerMat);
  dangerMesh.castShadow = true;
  dangerMesh.receiveShadow = true;
  group.add(dangerMesh);

  // Inner pillar (connects to next ring)
  const pillarGeo = new THREE.CylinderGeometry(innerRadius * 0.3, innerRadius * 0.3, RING_HEIGHT * 0.5, 16);
  const pillarMat = new THREE.MeshPhongMaterial({ color: 0x333355 });
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  pillar.position.y = -RING_HEIGHT * 0.25;
  group.add(pillar);

  scene.add(group);

  return {
    mesh: group,
    y: y,
    rotation: 0,
    safeStartAngle: safeStartAngle,
    safeLength: safeLength,
    passed: false,
    crashed: false,
  };
}

// ─── BALL CREATION ───
function createBall() {
  const geo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
  const mat = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    emissive: 0x667eea,
    emissiveIntensity: 0.3,
    shininess: 100,
    specular: 0xffffff,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// ─── PARTICLE EFFECTS ───
let particles = [];

function spawnParticles(position, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.08, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);
    mesh.position.x += (Math.random() - 0.5) * 0.5;
    mesh.position.z += (Math.random() - 0.5) * 0.5;
    scene.add(mesh);

    particles.push({
      mesh: mesh,
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 4,
        Math.random() * 5 + 2,
        (Math.random() - 0.5) * 4
      ),
      life: 1.0,
      decay: 0.02 + Math.random() * 0.02,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.velocity.y -= GRAVITY * 0.5 * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.life -= p.decay;
    p.mesh.material.opacity = Math.max(0, p.life);
    p.mesh.scale.setScalar(p.life);

    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─── LEVEL GENERATION ───
function generateLevel() {
  // Clear existing
  rings.forEach(r => scene.remove(r.mesh));
  rings = [];
  particles.forEach(p => { scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); });
  particles = [];

  if (ball) scene.remove(ball);
  ball = createBall();

  // Base platform at bottom
  const baseGeo = new THREE.CylinderGeometry(RING_RADIUS * 1.2, RING_RADIUS * 1.2, 0.5, 32);
  const baseMat = new THREE.MeshPhongMaterial({ color: 0x333355 });
  const base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = -0.25;
  base.receiveShadow = true;
  scene.add(base);

  // Generate rings from bottom to top
  const ringSpacing = RING_HEIGHT + 0.1;
  const totalRings = 50;

  let safeStart = Math.random() * Math.PI * 2;
  let safeLen = SAFE_RATIO * Math.PI * 2;

  for (let i = 0; i < totalRings; i++) {
    const y = i * ringSpacing;

    // Sometimes make danger zone larger (harder)
    const ratio = (i > 15 && Math.random() < 0.3) ? 0.5 : SAFE_RATIO;
    safeLen = ratio * Math.PI * 2;

    // Create some "combo-friendly" stacks: occasionally place safe zones aligned
    if (i > 2 && Math.random() < 0.15) {
      // Align with previous ring's safe zone for combo opportunities
      safeStart = rings[i - 1].safeStartAngle + Math.PI * 0.8 + (Math.random() - 0.5) * 0.4;
    } else {
      safeStart = Math.random() * Math.PI * 2;
    }

    const ring = createRing(y, safeStart, safeLen);
    rings.push(ring);
  }

  // Position ball at the FRONT of the top ring (sitting on surface)
  const topRing = rings[rings.length - 1];
  ball.position.set(0, topRing.y + RING_HEIGHT / 2 + BALL_RADIUS, RING_RADIUS - BALL_RADIUS - 0.05);
  ballVelocity = 0;
  ballOnRingIndex = rings.length - 1;
  falling = false;
  isHolding = false;
  fallingSpeed = 0;
  nextRingToCheck = rings.length - 1;
}

// ─── GAME LOGIC ───
function isAngleInSafe(angle, ring) {
  // Normalize angles
  let a = ((angle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let start = ((ring.safeStartAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let end = ((start + ring.safeLength) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

  if (ring.safeLength >= Math.PI * 1.99) return true; // almost full ring

  if (start < end) {
    return a >= start && a <= end;
  } else {
    // Wraps around
    return a >= start || a <= end;
  }
}

function isSafeForFalling(ballAngle, ring) {
  // For the falling variant: check if the ring's safe zone is currently
  // aligned with the ball's angle, accounting for ring rotation
  let a = ((ballAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let start = ((ring.safeStartAngle + ring.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  let end = ((start + ring.safeLength) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

  if (ring.safeLength >= Math.PI * 1.99) return true;

  if (start < end) {
    return a >= start && a <= end;
  } else {
    return a >= start || a <= end;
  }
}

function findHighestRemainingRing() {
  // Find the highest ring (largest index) that isn't passed or crashed
  for (let i = rings.length - 1; i >= 0; i--) {
    if (!rings[i].passed && !rings[i].crashed && !rings[i].breaking) {
      return i;
    }
  }
  return 0; // fallback
}

function breakRing(ring) {
  // Mark ring for breaking and animate it falling
  ring.breaking = true;
  ring.breakVelocity = -100; // initial upward pop
  ring.breakRotationSpeed = (Math.random() - 0.5) * 8;
  ring.breakColor = SAFE_COLOR;
}

function handleRingPass(ringIndex) {
  // Called when ball passes through a ring level
  const targetRing = rings[ringIndex];
  if (!targetRing || targetRing.passed || targetRing.crashed) return;

  // Ball is at front of ring (x=0, z=positive) = geometry angle 3PI/2
  const ballAngle = 3 * Math.PI / 2;
  const safe = isSafeForFalling(ballAngle, targetRing);

  if (safe) {
    // Safe pass - ring breaks and falls
    targetRing.passed = true;
    breakRing(targetRing);
    score++;
    combo++;
    updateScoreDisplay();
    updateComboDisplay();
    if (combo > 1) playCombo(combo);
    else playSafe();
    spawnParticles(new THREE.Vector3(0, targetRing.y, RING_RADIUS - BALL_RADIUS), SAFE_COLOR, 10);
  } else {
    // Danger hit - lose a life
    playCrash();
    playLifeLoss();
    shakeAmount = 0.3;
    targetRing.crashed = true;
    livesLeft--;
    combo = 0;
    updateComboDisplay();
    updateLivesDisplay();
    spawnParticles(new THREE.Vector3(0, targetRing.y, RING_RADIUS - BALL_RADIUS), DANGER_COLOR, 20);

    // Remove the danger ring from scene
    scene.remove(targetRing.mesh);
    targetRing.mesh.children.forEach(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) child.material.dispose();
    });

    if (livesLeft <= 0) {
      gameOver();
      return;
    }

    // Stop falling and reset to highest remaining ring
    falling = false;
    fallingSpeed = 0;
    ballOnRingIndex = findHighestRemainingRing();
    nextRingToCheck = ballOnRingIndex;
    ball.position.y = rings[ballOnRingIndex].y + RING_HEIGHT / 2 + BALL_RADIUS;
  }
}



function gameOver() {
  gameState = 'gameover';
  playGameOver();
  shakeAmount = 0.5;

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('stackJumpHigh', highScore.toString());
  }

  document.getElementById('highScore').textContent = `Best: ${highScore}`;

  setTimeout(() => {
    const msg = document.getElementById('message');
    msg.innerHTML = `
      <h1>GAME OVER</h1>
      <div class="sub">Score: ${score} ${score >= highScore && score > 0 ? '🏆 New Best!' : ''}</div>
      <button id="restartBtn">PLAY AGAIN</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
  }, 500);
}

// ─── UI UPDATES ───
function updateScoreDisplay() {
  const el = document.getElementById('score');
  el.textContent = score;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 100);
}

function updateLivesDisplay() {
  const el = document.getElementById('lives');
  el.textContent = '❤️'.repeat(Math.max(0, livesLeft)) + '🖤'.repeat(Math.max(0, LIVES - livesLeft));
}

function updateComboDisplay() {
  const el = document.getElementById('combo');
  if (combo > 1) {
    el.textContent = `🔥 ${combo}x COMBO`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

// ─── GAME START ───
function startGame() {
  initAudio();
  gameState = 'playing';
  score = 0;
  livesLeft = LIVES;
  combo = 0;
  shakeAmount = 0;
  isHolding = false;
  falling = false;

  document.getElementById('message').style.display = 'none';
  updateScoreDisplay();
  updateLivesDisplay();
  updateComboDisplay();

  nextRingToCheck = 0;
  generateLevel();
}

// ─── INPUT ───
function handleInputStart(e) {
  if (e) e.preventDefault();
  if (gameState === 'playing' && !falling) {
    isHolding = true;
    falling = true;
    fallingSpeed = 0;
    document.getElementById('fallIndicator').classList.add('active');
  }
}

function handleInputEnd(e) {
  if (e) e.preventDefault();
  if (gameState === 'playing') {
    isHolding = false;
    document.getElementById('fallIndicator').classList.remove('active');
    if (falling) {
      falling = false;
      fallingSpeed = 0;
    }
  }
}

renderer.domElement.addEventListener('mousedown', handleInputStart);
renderer.domElement.addEventListener('mouseup', handleInputEnd);
renderer.domElement.addEventListener('touchstart', handleInputStart, { passive: false });
renderer.domElement.addEventListener('touchend', handleInputEnd, { passive: false });
renderer.domElement.addEventListener('touchcancel', handleInputEnd, { passive: false });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') handleInputStart(e);
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') handleInputEnd(e);
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('startBtn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });

// ─── RESIZE ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── ANIMATION LOOP ───
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const dt = Math.min((now - lastTime) / 1000, 0.05); // cap delta
  lastTime = now;

  if (gameState === 'playing') {
    // Rotate rings
    rings.forEach((ring, i) => {
      if (!ring.crashed && !ring.breaking) {
        // Speed increases slightly with height
        const speed = ROTATION_SPEED * (1 + i * 0.005);
        ring.rotation += speed * dt;
        ring.mesh.rotation.y = ring.rotation;
      }
    });

    // Animate broken rings falling
    rings.forEach(ring => {
      if (ring.breaking && ring.mesh) {
        ring.breakVelocity += 1500 * dt; // gravity for broken rings
        ring.breakingMeshY = (ring.breakingMeshY || 0) + ring.breakVelocity * dt;
        ring.breakRotation += ring.breakRotationSpeed * dt;
        ring.mesh.position.y = ring.y + ring.breakingMeshY;
        ring.mesh.rotation.y = ring.rotation + ring.breakRotation;
        ring.mesh.children.forEach(child => {
          if (child.material && child.material.transparent !== undefined) {
            child.material.transparent = true;
            child.material.opacity = Math.max(0, (child.material.opacity !== undefined ? child.material.opacity : 1) - dt * 2);
          }
        });
      }
    });

    // Ball physics
    if (falling) {
      fallingSpeed += GRAVITY * dt * 0.3;
      if (fallingSpeed > FALL_SPEED * 1.5) fallingSpeed = FALL_SPEED * 1.5;

      ball.position.y -= fallingSpeed * dt;

      // Check rings in descending order (top to bottom)
      while (nextRingToCheck >= 0) {
        const ring = rings[nextRingToCheck];
        if (!ring.passed && !ring.crashed && !ring.breaking) {
          const ringTop = ring.y + RING_HEIGHT / 2;
          if (ball.position.y < ringTop) {
            ballOnRingIndex = nextRingToCheck - 1;
            handleRingPass(nextRingToCheck);
            nextRingToCheck--;
            if (gameState !== 'playing') break;
          } else {
            break; // ball hasn't reached this ring yet
          }
        } else {
          nextRingToCheck--; // skip already processed rings
        }
      }

      // If we've fallen past all rings, game over
      if (nextRingToCheck < 0 && ball.position.y < rings[0].y - BALL_RADIUS) {
        gameOver();
      }
    }

    // Idle bounce animation - ball bounces on current ring (only when not falling)
    if (!falling) {
      const currentRing = rings[ballOnRingIndex];
      if (currentRing) {
        const bouncePhase = performance.now() / 400;
        const bounceHeight = Math.abs(Math.sin(bouncePhase)) * 0.15;
        ball.position.y = currentRing.y + RING_HEIGHT / 2 + BALL_RADIUS + bounceHeight;
      }
    }

    // Ball wobble effect
    if (ball) {
      ball.rotation.x += dt * 3;
      ball.rotation.z += dt * 2;
    }

    // Camera follows ball
    const targetCamY = ball.position.y + 5;
    cameraTargetY += (targetCamY - cameraTargetY) * 3 * dt;
    camera.position.y = cameraTargetY;
    camera.position.z = 10 + (ball.position.y * 0.05);
    camera.lookAt(0, ball.position.y - 1, 0);

    // Point light follows ball
    pointLight.position.set(0, ball.position.y + 3, 0);
  }

  // Screen shake
  if (shakeAmount > 0) {
    camera.position.x = (Math.random() - 0.5) * shakeAmount * 2;
    shakeAmount *= 0.9;
    if (shakeAmount < 0.01) {
      shakeAmount = 0;
      camera.position.x = 0;
    }
  }

  // Update particles
  updateParticles(dt);

  renderer.render(scene, camera);
}

// Show initial high score
if (highScore > 0) {
  document.getElementById('highScore').textContent = `Best: ${highScore}`;
}

// Start render loop
animate(performance.now());
</script>
</body>
