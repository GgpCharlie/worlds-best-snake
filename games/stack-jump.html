                            <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Arial, sans-serif; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }

  #ui {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; display: flex; flex-direction: column; align-items: center;
  }

  #score {
    margin-top: 30px; font-size: 48px; font-weight: 800; color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 2px;
    transition: transform 0.1s;
  }
  #score.pop { transform: scale(1.3); }

  #lives {
    margin-top: 8px; font-size: 28px; letter-spacing: 4px;
  }

  #message {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: auto;
    width: 92vw; max-width: 620px;
  }

  #message h1 {
    font-size: 52px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6); margin-bottom: 10px;
  }

  #message .sub {
    font-size: 20px; color: rgba(255,255,255,0.7); margin-bottom: 30px;
  }

  #fallIndicator {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 8px; height: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0));
    border-radius: 4px; opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  #fallIndicator.active {
    opacity: 1;
  }

  #message button {
    padding: 16px 48px; font-size: 22px; font-weight: 700;
    border: none; border-radius: 50px; cursor: pointer;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; box-shadow: 0 6px 25px rgba(102,126,234,0.5);
    transition: transform 0.15s, box-shadow 0.15s;
    pointer-events: auto;
  }
  #message button:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(102,126,234,0.7); }
  #message button:active { transform: scale(0.97); }
  #message .btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  #message button.ghost {
    background: rgba(255,255,255,0.12); box-shadow: none;
    border: 2px solid rgba(255,255,255,0.35); padding: 14px 34px; font-size: 18px;
  }
  #message .stat { font-size: 46px; font-weight: 900; color: #ffd700; margin-bottom: 6px;
    text-shadow: 0 4px 18px rgba(255,215,0,0.35); }

  #level {
    position: absolute; top: 30px; left: 30px; font-size: 18px; font-weight: 700;
    color: rgba(255,255,255,0.55); letter-spacing: 2px;
  }

  #combo {
    position: absolute; top: 100px; right: 30px;
    font-size: 24px; font-weight: 700; color: #ffd700;
    text-shadow: 0 2px 10px rgba(255,215,0,0.5);
    opacity: 0; transition: opacity 0.3s;
  }
  #combo.show { opacity: 1; }

  #highScore {
    position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
    font-size: 16px; color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div id="ui">
  <div id="score">0</div>
  <div id="lives"></div>
  <div id="level"></div>
  <div id="combo"></div>
  <div id="highScore"></div>
  <div id="fallIndicator"></div>
  <div id="message">
    <h1>STACK JUMP</h1>
    <div class="sub">Hold to dive — land on the green</div>
    <button id="startBtn">PLAY</button>
  </div>
</div>

<script src="vendor/three/three.global.js"></script>
<script>
// ─── AUDIO ENGINE (Web Audio API, no external files) ───
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
  if (audioCtx.state === 'suspended') audioCtx.resume(); // phones start audio paused
}

function playTone(freq, duration, type='sine', vol=0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playThud(speed) {
  // landing on a ring — lower and heavier the harder it hits
  const s = Math.min(1, speed / MAX_FALL);
  playTone(85 + s * 90, 0.08, 'sine', 0.04 + s * 0.12);
}
function playSmash(speed, combo) {
  // punching through a ring — pitch climbs with speed and with the combo
  const s = Math.min(1, speed / MAX_FALL);
  playTone(360 + s * 260 + (combo - 1) * 55, 0.1, 'triangle', 0.16);
  playTone(120 + s * 90, 0.12, 'sawtooth', 0.07);
}
function playCrash()   { playTone(120, 0.25, 'sawtooth', 0.18); playTone(80, 0.3, 'square', 0.1); }
function playLifeLoss(){ playTone(300, 0.15, 'sine', 0.15); setTimeout(()=>playTone(200, 0.2, 'sine', 0.12), 100); }
function playGameOver(){ playTone(250, 0.3, 'sawtooth', 0.2); setTimeout(()=>playTone(180, 0.4, 'sawtooth', 0.18), 200); setTimeout(()=>playTone(100, 0.5, 'sawtooth', 0.15), 400); }
function playClear()   { playTone(523, 0.15, 'triangle', 0.16); setTimeout(()=>playTone(659, 0.15, 'triangle', 0.16), 130); setTimeout(()=>playTone(784, 0.3, 'triangle', 0.16), 260); }

// ─── GAME CONSTANTS ───
const RING_RADIUS    = 3;
const RING_HEIGHT    = 0.28;
const BALL_RADIUS    = 0.5;
const RING_SPACING   = 0.85;  // ring centres — tight enough to read as a stack
const TOTAL_RINGS    = 40;
const GRAVITY        = 38;    // normal pull (idle bounces, coasting after you let go)
const HOLD_GRAVITY   = 46;    // pull while you hold — this is the dive
const SETTLE_SPEED   = 5.5;   // how fast the ball drifts down after you let go
const MAX_FALL       = 9;     // terminal speed, units per second
const HOP_HEIGHT     = 0.5;   // how high the ball bounces while it is just sitting on a ring
const ROTATION_SPEED = 1.2;   // radians per second
const LIVES          = 3;
const SAFE_RATIO     = 0.75;  // 75% safe, 25% danger
const BALL_ANGLE     = 3 * Math.PI / 2; // the ball sits at the front of every ring
const HOP_VY         = Math.sqrt(2 * GRAVITY * HOP_HEIGHT); // speed of one idle bounce, used by the camera

// ─── COLORS ───
const SAFE_COLOR = 0x4ade80;
const DANGER_COLOR = 0xef4444;

// ─── THREE.JS SETUP ───
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1a1a2e);
document.body.prepend(renderer.domElement);

// Lights (the vendored r160 build needs bigger numbers than the old CDN one to look the same)
const ambientLight = new THREE.AmbientLight(0xffffff, 1.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
dirLight.shadow.camera.near = 1;
dirLight.shadow.camera.far = 40;
dirLight.shadow.camera.left = -8;
dirLight.shadow.camera.right = 8;
dirLight.shadow.camera.top = 8;
dirLight.shadow.camera.bottom = -8;
dirLight.shadow.camera.updateProjectionMatrix();
scene.add(dirLight);
scene.add(dirLight.target);

const pointLight = new THREE.PointLight(0x667eea, 6, 20);
pointLight.position.set(0, 5, 0);
scene.add(pointLight);

// Camera position
camera.position.set(0, 6, 10);
camera.lookAt(0, 2, 0);

// ─── GAME STATE ───
let rings = [];
let base = null;
let pole = null;
let ball;
let score = 0;
let livesLeft = LIVES;
let combo = 0;
let gameState = 'menu'; // menu, playing, gameover
let highScore = parseInt(localStorage.getItem('stackJumpHigh') || '0', 10);
if (!Number.isFinite(highScore) || highScore < 0) highScore = 0; // junk save data
let cameraTargetY = 6;
let shakeAmount = 0;
let isHolding = false;     // whether user is holding touch/click
let armed = true;          // one hold = one smash attempt; let go to re-arm after a bounce off red
let diving = false;        // true from the moment you press until the ball next comes to rest
let ballVY = 0;            // ball's vertical speed (negative = dropping)
let squash = 0;            // 0 = round ball, 1 = fully flattened (impact squash and stretch)
let hitStop = 0;           // tiny freeze-frame when the ball smashes through a ring
let nextRingToCheck = 0;   // which ring the ball will meet next
let anchorY = 0;           // the height the camera sits on while the ball is just bobbing
let camAnchored = false;   // keeps the camera still so the idle bounce doesn't wobble the view
let diveMix = 0;           // smoothed speed 0..1, used for the camera pull-back
let level = 1;             // which tower you are on — each one spins a bit faster
let scoreAtTowerStart = 0; // so REPLAY puts your score back to the start of this tower

// ─── RING CREATION ───
function createRingGeometry(radius, innerRadius, thickness, arcStart, arcEnd) {
  // Create a ring segment using RingGeometry
  const shape = new THREE.Shape();
  const segments = 64;
  const startAngle = arcStart;
  const endAngle = arcEnd;

  // Outer arc
  for (let i = 0; i <= segments; i++) {
    const angle = startAngle + (endAngle - startAngle) * (i / segments);
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  // Inner arc (reverse)
  for (let i = segments; i >= 0; i--) {
    const angle = startAngle + (endAngle - startAngle) * (i / segments);
    const x = Math.cos(angle) * innerRadius;
    const y = Math.sin(angle) * innerRadius;
    shape.lineTo(x, y);
  }
  shape.closePath();

  const extrudeSettings = { depth: thickness, bevelEnabled: false };
  const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
  geometry.rotateX(-Math.PI / 2);
  return geometry;
}

function createRing(y, safeStartAngle, safeLength) {
  const group = new THREE.Group();
  group.position.y = y;

  const innerRadius = RING_RADIUS * 0.55;
  const outerRadius = RING_RADIUS;

  // Safe segment (always green)
  const safeEnd = safeStartAngle + safeLength;
  const safeGeo = createRingGeometry(outerRadius, innerRadius, RING_HEIGHT, safeStartAngle, safeEnd);
  const safeMat = new THREE.MeshPhongMaterial({
    color: SAFE_COLOR,
    shininess: 80,
    specular: 0x444444,
  });
  const safeMesh = new THREE.Mesh(safeGeo, safeMat);
  safeMesh.castShadow = true;
  safeMesh.receiveShadow = true;
  group.add(safeMesh);

  // Danger segment (always red)
  const dangerStart = safeEnd;
  const dangerEnd = safeStartAngle + Math.PI * 2;
  const dangerGeo = createRingGeometry(outerRadius, innerRadius, RING_HEIGHT, dangerStart, dangerEnd);
  const dangerMat = new THREE.MeshPhongMaterial({
    color: DANGER_COLOR,
    shininess: 80,
    specular: 0x444444,
  });
  const dangerMesh = new THREE.Mesh(dangerGeo, dangerMat);
  dangerMesh.castShadow = true;
  dangerMesh.receiveShadow = true;
  group.add(dangerMesh);

  // Inner pillar (connects to next ring)
  const pillarGeo = new THREE.CylinderGeometry(innerRadius * 0.3, innerRadius * 0.3, RING_HEIGHT * 0.5, 16);
  const pillarMat = new THREE.MeshPhongMaterial({ color: 0x333355 });
  const pillar = new THREE.Mesh(pillarGeo, pillarMat);
  pillar.position.y = -RING_HEIGHT * 0.25;
  group.add(pillar);

  scene.add(group);

  return {
    mesh: group,
    y: y,
    rotation: 0,
    spinSpeed: 1,
    wobble: 0,        // gets bumped when the ball lands on it, then settles back
    pulse: 0,         // squash on the ring itself when hit
    safeStartAngle: safeStartAngle,
    safeLength: safeLength,
    passed: false,
  };
}

// ─── BALL CREATION ───
function createBall() {
  const geo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
  const mat = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    emissive: 0x667eea,
    emissiveIntensity: 0.3,
    shininess: 100,
    specular: 0xffffff,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

// ─── PARTICLE EFFECTS ───
let particles = [];

function spawnParticles(position, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.08, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(position);
    mesh.position.x += (Math.random() - 0.5) * 0.5;
    mesh.position.z += (Math.random() - 0.5) * 0.5;
    scene.add(mesh);

    particles.push({
      mesh: mesh,
      velocity: new THREE.Vector3(
        (Math.random() - 0.5) * 4,
        Math.random() * 5 + 2,
        (Math.random() - 0.5) * 4
      ),
      life: 1.0,
      decay: 0.02 + Math.random() * 0.02,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.velocity.y -= 60 * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);
    p.life -= p.decay;
    p.mesh.material.opacity = Math.max(0, p.life);
    p.mesh.scale.setScalar(p.life);

    if (p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─── LEVEL GENERATION ───
function disposeObject(obj) {
  obj.traverse(child => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  });
}

function generateLevel() {
  // Clear everything from the last round
  rings.forEach(removeRingMesh);
  rings = [];
  clearEffects();
  if (base) { scene.remove(base); base.geometry.dispose(); base.material.dispose(); }
  if (pole) { scene.remove(pole); pole.geometry.dispose(); pole.material.dispose(); }

  if (ball) { scene.remove(ball); disposeObject(ball); }
  ball = createBall();

  // Base platform at bottom
  const baseGeo = new THREE.CylinderGeometry(RING_RADIUS * 1.2, RING_RADIUS * 1.2, 0.5, 32);
  const baseMat = new THREE.MeshPhongMaterial({ color: 0x333355 });
  base = new THREE.Mesh(baseGeo, baseMat);
  base.position.y = -0.25;
  base.receiveShadow = true;
  scene.add(base);

  // One pole up the middle holds the whole tower together
  pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.35, TOTAL_RINGS * RING_SPACING + 1, 16),
    new THREE.MeshPhongMaterial({ color: 0x333355 })
  );
  pole.position.y = (TOTAL_RINGS * RING_SPACING) / 2;
  pole.castShadow = true;
  scene.add(pole);

  // Rings from the bottom up, spaced out so the ball has room to build up speed.
  // You start at the top, so the rings further down are the harder ones.
  let safeStart = Math.random() * Math.PI * 2;
  const spinBoost = 1 + (level - 1) * 0.08; // each tower you clear spins a bit faster

  for (let i = 0; i < TOTAL_RINGS; i++) {
    const progress = 1 - i / TOTAL_RINGS;   // 0 at the top, almost 1 at the bottom
    const y = (i + 1) * RING_SPACING;

    // The safe window shrinks as you go down, and with every tower (never below 40%)
    const safeLen = Math.max(0.4, SAFE_RATIO - 0.3 * progress - (level - 1) * 0.03) * Math.PI * 2;

    // And the rings spin faster down there too
    const spinSpeed = (1 + progress * 0.9) * spinBoost;

    // Occasionally line a safe zone up with the ring below it so combos are possible
    if (i > 2 && Math.random() < 0.15) {
      safeStart = rings[i - 1].safeStartAngle + Math.PI * 0.8 + (Math.random() - 0.5) * 0.4;
    } else {
      safeStart = Math.random() * Math.PI * 2;
    }

    const ring = createRing(y, safeStart, safeLen);
    ring.spinSpeed = spinSpeed;
    rings.push(ring);
  }

  // Ball starts just above the top ring and drops onto it
  const topRing = rings[rings.length - 1];
  ball.position.set(0, ringTopY(topRing) + BALL_RADIUS + 0.6, RING_RADIUS - BALL_RADIUS - 0.05);
  ballVY = 0;
  squash = 0;
  cameraTargetY = ball.position.y + 4.5; // start the camera up here, not down at the base
  camAnchored = false;
  anchorY = ball.position.y;
  diveMix = 0;
  nextRingToCheck = rings.length - 1;
  armed = true;
}

// ─── GAME LOGIC ───
function isSafeForFalling(ballAngle, ring) {
  // Is the green part of the ring currently over the ball's spot at the front,
  // once you allow for how far the ring has spun?
  let a = ((ballAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  let start = ((ring.safeStartAngle + ring.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  let end = ((start + ring.safeLength) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

  if (ring.safeLength >= Math.PI * 1.99) return true;

  if (start < end) {
    return a >= start && a <= end;
  } else {
    return a >= start || a <= end;
  }
}

function ringTopY(ring) {
  // The ring geometry is extruded upwards from the group, so the top face sits here
  return ring.y + RING_HEIGHT;
}

// ─── BREAKING A RING: shards blast outwards so they never clip through the rings below ───
let shards = [];
let waves = [];
let confetti = [];
const CONFETTI_COLORS = [0xff6b6b, 0xfeca57, 0x48dbfb, 0x1dd1a1, 0xf368e0, 0xffd700];

function shatterRing(ring, impactSpeed) {
  const chunks = 8;
  const arc = (Math.PI * 2) / chunks;
  const inner = RING_RADIUS * 0.55;
  const gap = 0.06;
  const push = 3 + impactSpeed * 0.45; // harder hit = wider spray

  for (let i = 0; i < chunks; i++) {
    const a0 = ring.rotation + i * arc + gap * 0.5;
    const geo = createRingGeometry(RING_RADIUS, inner, RING_HEIGHT, a0, a0 + arc - gap);
    const mat = new THREE.MeshPhongMaterial({
      color: SAFE_COLOR, shininess: 80, specular: 0x444444, transparent: true,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.y = ring.y;
    scene.add(mesh);

    const mid = a0 + arc * 0.5; // geometry angle -> world direction is (cos, -sin)
    shards.push({
      mesh: mesh,
      vx: Math.cos(mid) * push * (0.8 + Math.random() * 0.5),
      vz: -Math.sin(mid) * push * (0.8 + Math.random() * 0.5),
      vy: 1.5 + Math.random() * 2 + impactSpeed * 0.1,
      spin: (Math.random() - 0.5) * 4,
      life: 1,
      decay: 2.6,
    });
  }

  // shockwave that expands outwards and fades
  const waveGeo = new THREE.RingGeometry(RING_RADIUS * 0.5, RING_RADIUS * 0.8, 40);
  waveGeo.rotateX(-Math.PI / 2);
  const waveMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  const wave = new THREE.Mesh(waveGeo, waveMat);
  wave.position.y = ringTopY(ring);
  scene.add(wave);
  waves.push({ mesh: wave, life: 1, grow: 2.5 + impactSpeed * 0.08 });
}

function launchConfetti(fromY) {
  for (let i = 0; i < 110; i++) {
    const geo = new THREE.BoxGeometry(0.22, 0.04, 0.13);
    const mat = new THREE.MeshBasicMaterial({
      color: CONFETTI_COLORS[i % CONFETTI_COLORS.length], transparent: true,
    });
    const mesh = new THREE.Mesh(geo, mat);
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 1.6;
    mesh.position.set(Math.cos(a) * r, fromY + Math.random() * 0.6, Math.sin(a) * r);
    mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    scene.add(mesh);
    confetti.push({
      mesh: mesh,
      vx: Math.cos(a) * (0.8 + Math.random() * 2),
      vz: Math.sin(a) * (0.8 + Math.random() * 2),
      vy: 7 + Math.random() * 8,
      spinX: (Math.random() - 0.5) * 12,
      spinY: (Math.random() - 0.5) * 12,
      life: 1,
      decay: 0.4 + Math.random() * 0.3,
    });
  }
}

function updateEffects(dt) {
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.vy -= 45 * dt;
    s.mesh.position.x += s.vx * dt;
    s.mesh.position.y += s.vy * dt;
    s.mesh.position.z += s.vz * dt;
    s.mesh.rotation.y += s.spin * dt;
    s.life -= s.decay * dt;
    s.mesh.material.opacity = Math.max(0, s.life);
    if (s.life <= 0) {
      scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose();
      shards.splice(i, 1);
    }
  }
  for (let i = waves.length - 1; i >= 0; i--) {
    const w = waves[i];
    w.life -= dt * 3;
    const grow = 1 + (1 - Math.max(0, w.life)) * w.grow;
    w.mesh.scale.set(grow, 1, grow);
    w.mesh.material.opacity = Math.max(0, w.life) * 0.55;
    if (w.life <= 0) {
      scene.remove(w.mesh); w.mesh.geometry.dispose(); w.mesh.material.dispose();
      waves.splice(i, 1);
    }
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const c = confetti[i];
    c.vy -= 17 * dt;                    // floats down slow, like real paper
    c.vx = Math.max(0, c.vx - c.vx * 1.4 * dt);
    c.vz = Math.max(0, c.vz - c.vz * 1.4 * dt);
    c.mesh.position.x += c.vx * dt;
    c.mesh.position.y += c.vy * dt;
    c.mesh.position.z += c.vz * dt;
    c.mesh.rotation.x += c.spinX * dt;
    c.mesh.rotation.y += c.spinY * dt;
    if (c.mesh.position.y < 0.05 && c.vy < 0) { // it lands on the base platform and settles
      c.mesh.position.y = 0.05;
      c.vy = 0;
      c.spinX *= 0.9; c.spinY *= 0.9;
    }
    c.life -= c.decay * dt;
    c.mesh.material.opacity = Math.max(0, c.life);
    if (c.life <= 0) {
      scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose();
      confetti.splice(i, 1);
    }
  }
}

function removeRingMesh(ring) {
  if (!ring.mesh) return;
  scene.remove(ring.mesh);
  disposeObject(ring.mesh);
  ring.mesh = null;
}

function clearEffects() {
  shards.forEach(s => { scene.remove(s.mesh); s.mesh.geometry.dispose(); s.mesh.material.dispose(); });
  waves.forEach(w => { scene.remove(w.mesh); w.mesh.geometry.dispose(); w.mesh.material.dispose(); });
  confetti.forEach(c => { scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); });
  particles.forEach(p => { scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose(); });
  shards = []; waves = []; confetti = []; particles = [];
}

function smashRing(ringIndex, impactSpeed) {
  // Green under the ball: it punches straight through and the ring explodes outwards
  const ring = rings[ringIndex];
  ring.passed = true;
  shatterRing(ring, impactSpeed);
  removeRingMesh(ring);
  camAnchored = false; // the camera follows the ball again while it is diving

  score++;
  combo++;
  updateScoreDisplay();
  updateComboDisplay();
  playSmash(impactSpeed, combo);
  hitStop = Math.min(0.045, 0.01 + impactSpeed * 0.0025);
  shakeAmount = Math.min(0.3, 0.05 + impactSpeed * 0.011);
  squash = Math.min(0.3, 0.08 + impactSpeed * 0.008);
  spawnParticles(new THREE.Vector3(0, ringTopY(ring), RING_RADIUS - BALL_RADIUS), SAFE_COLOR,
                 8 + Math.round(impactSpeed * 0.4));
}

function bounceOffDanger(ring, impactSpeed) {
  // Red under the ball: that part is solid, so the ball bounces off and it costs a life
  livesLeft--;
  combo = 0;
  updateComboDisplay();
  updateLivesDisplay();
  playCrash();
  playLifeLoss();
  shakeAmount = 0.55;
  hitStop = 0.08;
  squash = 0.55;
  ring.wobble = 1;
  ring.pulse = 1;
  spawnParticles(new THREE.Vector3(0, ringTopY(ring), RING_RADIUS - BALL_RADIUS), DANGER_COLOR, 20);

  ball.position.y = ringTopY(ring) + BALL_RADIUS;
  ballVY = Math.max(5, impactSpeed * 0.5); // thump back upwards
  armed = false; // let go and press again to have another go at this ring
  camAnchored = true;
  anchorY = ringTopY(ring) + BALL_RADIUS;

  if (livesLeft <= 0) gameOver();
}

function landOnRing(ring, surfaceY, impact) {
  // The ball drops onto a ring: squash, thud, the ring wobbles, then it hops again
  ball.position.y = surfaceY;
  const strength = Math.min(1, impact / MAX_FALL);
  squash = 0.15 + strength * 0.4;
  const hop = Math.sqrt(2 * GRAVITY * HOP_HEIGHT);            // speed needed for the idle bounce height
  ballVY = Math.max(hop, Math.min(hop * 2.2, impact * 0.5)); // hard landings rebound, then settle
  ring.wobble = Math.max(ring.wobble, 0.4 + strength * 0.6);
  ring.pulse = 1;
  camAnchored = true;   // the view stops here and stays put while the ball bobs
  anchorY = surfaceY;
  const wasDive = diving;
  diving = false;
  if (!wasDive) return; // the little idle bob stays quiet — only real landings get heard
  playThud(impact);
  shakeAmount = Math.max(shakeAmount, strength * 0.15);
  spawnParticles(new THREE.Vector3(0, surfaceY - BALL_RADIUS, RING_RADIUS - BALL_RADIUS), 0x9999bb,
                 2 + Math.round(strength * 8));
}

function bindBtn(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('click', (e) => { e.preventDefault(); fn(); });
  el.addEventListener('touchend', (e) => { e.preventDefault(); fn(); });
}

// title, the line under it, and the buttons to offer: [{ label, fn }, ...]
function endGame(title, note, actions) {
  gameState = 'gameover';
  isHolding = false;
  armed = true;
  diving = false;
  document.getElementById('fallIndicator').classList.remove('active');

  const beatBest = score > highScore;
  if (beatBest) {
    highScore = score;
    localStorage.setItem('stackJumpHigh', highScore.toString());
  }
  document.getElementById('highScore').textContent = `Best: ${highScore}`;

  setTimeout(() => {
    const msg = document.getElementById('message');
    msg.innerHTML = `
      <h1>${title}</h1>
      <div class="stat">${score}</div>
      <div class="sub">${note}</div>
      <div class="btns">
        ${actions.map((a, i) => `<button id="act${i}"${i ? ' class="ghost"' : ''}>${a.label}</button>`).join('')}
      </div>
    `;
    msg.style.display = 'block'; // this is what was missing — the panel stayed hidden after PLAY
    actions.forEach((a, i) => bindBtn('act' + i, a.fn));
  }, 600);
}

function gameOver() {
  playGameOver();
  shakeAmount = 0.5;
  endGame('GAME OVER', `Tower ${level} · Best ${highScore}`, [
    { label: 'RETRY',   fn: () => startTower(level, false) },
    { label: 'MENU',    fn: showMenu },
  ]);
}

function towerCleared() {
  playClear();
  shakeAmount = 0.3;
  launchConfetti(0.4);
  endGame(`TOWER ${level} CLEARED! 🎉`,
          `All ${TOTAL_RINGS} rings smashed${score > highScore ? ' — new best score!' : ` · Best ${highScore}`}`, [
    { label: 'NEXT TOWER', fn: () => startTower(level + 1, true) },
    { label: 'REPLAY',     fn: () => startTower(level, false) },
    { label: 'MENU',       fn: showMenu },
  ]);
}

// ─── UI UPDATES ───
function updateScoreDisplay() {
  const el = document.getElementById('score');
  el.textContent = score;
  el.classList.add('pop');
  setTimeout(() => el.classList.remove('pop'), 100);
}

function updateLivesDisplay() {
  const el = document.getElementById('lives');
  el.textContent = '❤️'.repeat(Math.max(0, livesLeft)) + '🖤'.repeat(Math.max(0, LIVES - livesLeft));
}

function updateComboDisplay() {
  const el = document.getElementById('combo');
  if (combo > 1) {
    el.textContent = `🔥 ${combo}x COMBO`;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}

function updateLevelDisplay() {
  document.getElementById('level').textContent = `TOWER ${level}`;
}

// ─── GAME START ───
function startGame() {
  initAudio();
  gameState = 'playing';
  scoreAtTowerStart = score; // where REPLAY will put you back to
  livesLeft = LIVES;
  combo = 0;
  shakeAmount = 0;
  hitStop = 0;
  isHolding = false;
  armed = true;
  diving = false;
  diveMix = 0;

  document.getElementById('message').style.display = 'none';
  updateLevelDisplay();
  updateScoreDisplay();
  updateLivesDisplay();
  updateComboDisplay();

  generateLevel();
}

// startTower(n, keepScore) — "next" keeps your score, a restart puts it back
function startTower(n, keepScore) {
  level = Math.max(1, n);
  if (!keepScore) score = scoreAtTowerStart;
  startGame();
}

function showMenu() {
  gameState = 'menu';
  level = 1;
  score = 0;
  scoreAtTowerStart = 0;
  livesLeft = LIVES;
  combo = 0;
  hitStop = 0;
  isHolding = false;
  generateLevel(); // leave a fresh tower standing behind the title
  ball.position.y = ringTopY(rings[rings.length - 1]) + BALL_RADIUS; // sat still on the top ring
  camAnchored = true;
  anchorY = ball.position.y;
  cameraTargetY = ball.position.y + 4.5;
  updateScoreDisplay();
  updateLivesDisplay();
  updateComboDisplay();
  document.getElementById('level').textContent = '';
  const msg = document.getElementById('message');
  msg.innerHTML = `
    <h1>STACK JUMP</h1>
    <div class="sub">Hold to dive — smash through the green</div>
    <div class="btns"><button id="startBtn">PLAY</button></div>
  `;
  msg.style.display = 'block';
  bindBtn('startBtn', () => startTower(1, false));
}

// ─── INPUT ───
function handleInputStart(e) {
  if (e) e.preventDefault();
  if (gameState !== 'playing' || isHolding) return;
  isHolding = true;
  document.getElementById('fallIndicator').classList.add('active');
  if (armed) {
    diving = true;        // next landing counts as a real landing, not an idle bob
    camAnchored = false;  // let the camera chase the ball again
    if (ballVY > -2) ballVY = -3; // shove off the ring so the dive starts instantly
  }
}

function handleInputEnd(e) {
  if (e) e.preventDefault();
  isHolding = false;
  armed = true; // ready for the next dive
  document.getElementById('fallIndicator').classList.remove('active');
}

renderer.domElement.addEventListener('mousedown', handleInputStart);
renderer.domElement.addEventListener('touchstart', handleInputStart, { passive: false });
renderer.domElement.addEventListener('touchend', handleInputEnd, { passive: false });
renderer.domElement.addEventListener('touchcancel', handleInputEnd, { passive: false });
// Letting go outside the window, alt-tabbing or switching tabs mid-hold still stops the fall
window.addEventListener('mouseup', handleInputEnd);
window.addEventListener('blur', handleInputEnd);
document.addEventListener('visibilitychange', () => { if (document.hidden) handleInputEnd(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') handleInputStart(e);
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') handleInputEnd(e);
});

// ─── RESIZE ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── ANIMATION LOOP ───
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);

  const rawDt = (now - lastTime) / 1000;
  let dt = Math.min(rawDt, 0.05); // cap delta
  lastTime = now;

  if (hitStop > 0) {
    // freeze the world for a few milliseconds after a big hit — sells the impact
    hitStop -= rawDt;
    dt = 0;
  }

  // Rings spin (faster further down the tower) and wobble after being hit.
  // This runs outside the "playing" check so the tower is still alive behind the menus.
  rings.forEach(ring => {
    if (!ring.mesh) return;
    if (!ring.passed) ring.rotation += ROTATION_SPEED * ring.spinSpeed * dt;
    ring.wobble = Math.max(0, ring.wobble - dt * 2.5);
    ring.pulse = Math.max(0, ring.pulse - dt * 4);
    ring.mesh.rotation.y = ring.rotation;
    ring.mesh.rotation.z = Math.sin(now * 0.03) * 0.07 * ring.wobble;
    ring.mesh.scale.set(1 - ring.pulse * 0.1, 1, 1 - ring.pulse * 0.1);
  });

  if (gameState === 'playing') {
    // ─── BALL PHYSICS ───
    // Gravity: a normal pull normally, a proper dive while holding
    ballVY -= ((isHolding && armed) ? HOLD_GRAVITY : GRAVITY) * dt;

    if (isHolding && armed) {
      if (ballVY < -MAX_FALL) ballVY = -MAX_FALL;
    } else if (ballVY < -SETTLE_SPEED) {
      // letting go catches the air, so the ball eases onto the ring below
      // instead of freezing in mid-air
      ballVY += (-SETTLE_SPEED - ballVY) * Math.min(1, 9 * dt);
    }

    ball.position.y += ballVY * dt;

    // Handle every ring the ball has reached this frame (fast = several at once)
    while (nextRingToCheck >= 0) {
      const ring = rings[nextRingToCheck];
      if (ring.passed) { nextRingToCheck--; continue; }

      const surfaceY = ringTopY(ring) + BALL_RADIUS;
      if (ball.position.y > surfaceY) break; // hasn't got there yet

      const impact = Math.abs(ballVY);
      if (isHolding && armed) {
        if (isSafeForFalling(BALL_ANGLE, ring)) {
          smashRing(nextRingToCheck, impact);
          nextRingToCheck--;
          if (gameState !== 'playing') break;
        } else {
          bounceOffDanger(ring, impact); // solid red: bounces off, costs a life
          break;
        }
      } else {
        landOnRing(ring, surfaceY, impact);
        break;
      }
    }

    // All rings gone below: the ball lands on the base and the tower is cleared
    if (nextRingToCheck < 0 && ball.position.y <= BALL_RADIUS) {
      ball.position.y = BALL_RADIUS;
      squash = 0.4;
      if (gameState === 'playing') towerCleared();
    }

    // Squash and stretch — this is what makes the ball feel heavy
    const stretch = Math.min(0.3, Math.abs(ballVY) / MAX_FALL * 0.3);
    const ballXZ = (1 + squash * 0.6) * (1 - stretch * 0.35);
    ball.scale.set(ballXZ, (1 - squash) * (1 + stretch), ballXZ);
    ball.rotation.x -= (2 + Math.abs(ballVY) * 0.3) * dt;
    ball.rotation.z += dt * 1.5;
  }

  // ─── CAMERA ─── sits on the ring the ball is bobbing on, so the idle bounce never
  // nudges the view. It only chases the ball while it is actually diving.
  if (ball) {
    const focusY = camAnchored ? anchorY : ball.position.y;
    // While the ball is just bobbing there is no dive at all, so the lens never creeps
    // in or out. It only pulls back once the ball is genuinely falling.
    const rawDive = camAnchored ? 0 : Math.min(1, Math.max(0, Math.abs(ballVY) - HOP_VY) / (MAX_FALL - HOP_VY));
    diveMix += (rawDive - diveMix) * Math.min(1, 6 * dt); // smoothed, so nothing pops
    cameraTargetY += ((focusY + 4.5) - cameraTargetY) * (5 + diveMix * 7) * dt;
    camera.position.y = cameraTargetY;
    camera.position.z = 9.5 + diveMix * 2.5;
    camera.lookAt(0, focusY - 0.5, 0);

    // Lights follow the same anchor, so the shading does not pulse either
    pointLight.position.set(0, focusY + 3, 0);
    dirLight.position.set(5, focusY + 10, 7);
    dirLight.target.position.set(0, focusY, 0);
  }

  // The squash always wears off, so the ball rounds back up even after the run ends
  squash = Math.max(0, squash - dt * 4);
  if (gameState !== 'playing' && ball) ball.scale.set(1 + squash * 0.6, 1 - squash, 1 + squash * 0.6);

  // Screen shake
  if (shakeAmount > 0) {
    camera.position.x = (Math.random() - 0.5) * shakeAmount * 2;
    shakeAmount = Math.max(0, shakeAmount - dt * 3);
    if (shakeAmount < 0.01) {
      shakeAmount = 0;
      camera.position.x = 0;
    }
  }

  // Effects (particles, ring shards, shockwaves) keep running even after a game over
  updateParticles(dt);
  updateEffects(dt);

  renderer.render(scene, camera);
}

// Show initial high score
if (highScore > 0) {
  document.getElementById('highScore').textContent = `Best: ${highScore}`;
}

// Start the title screen (builds the first tower and wires the PLAY button)
showMenu();

// Start render loop
animate(performance.now());
</script>
</body>
