<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Portal Defense</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; }
        body.game-active { cursor: none; }
        canvas { display: block; }

        #crosshair {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; z-index: 100; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(0, 255, 255, 0.9);
        }
        #crosshair::before { width: 2px; height: 100%; left: 50%; transform: translateX(-50%); }
        #crosshair::after { height: 2px; width: 100%; top: 50%; transform: translateY(-50%); }
        #crosshair .dot {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 4px; height: 4px; background: #ff0040; border-radius: 50%;
        }

        #hud {
            position: fixed; top: 0; left: 0; width: 100%; padding: 20px 30px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 50; pointer-events: none;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 20px; border-radius: 8px; backdrop-filter: blur(5px);
        }
        .hud-label { font-size: 0.6rem; color: rgba(0, 255, 255, 0.6); letter-spacing: 2px; }
        .hud-value { font-size: 1.5rem; color: #0ff; font-weight: 700; }
        #health-bar-container {
            width: 200px; height: 8px; background: rgba(255, 0, 64, 0.2);
            border-radius: 4px; margin-top: 5px; overflow: hidden;
        }
        #health-bar {
            width: 100%; height: 100%; background: linear-gradient(90deg, #ff0040, #ff4080);
            border-radius: 4px; transition: width 0.3s;
        }

        #start-screen, #death-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 200; cursor: default;
        }
        #start-screen { background: rgba(0, 0, 0, 0.85); }
        #death-screen {
            background: rgba(80, 0, 0, 0); display: none;
            animation: deathFadeIn 2s forwards;
        }
        @keyframes deathFadeIn {
            0% { background: rgba(80, 0, 0, 0); }
            100% { background: rgba(80, 0, 0, 0.85); }
        }
        .title {
            font-size: 3rem; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(135deg, #00ffff, #ff0040);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 20px; text-align: center;
        }
        .subtitle {
            font-size: 1rem; color: rgba(255, 255, 255, 0.5); letter-spacing: 3px;
            margin-bottom: 40px; text-align: center;
        }
        .btn {
            padding: 15px 50px; font-family: 'Orbitron', sans-serif; font-size: 1rem;
            font-weight: 700; letter-spacing: 3px; border: 2px solid #0ff;
            background: rgba(0, 255, 255, 0.1); color: #0ff; border-radius: 8px;
            cursor: pointer; transition: all 0.3s; text-transform: uppercase;
            pointer-events: all;
        }
        .btn:hover {
            background: rgba(0, 255, 255, 0.3); box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            transform: scale(1.05);
        }
        #death-screen .title {
            font-size: 4rem; color: #ff0040;
            -webkit-text-fill-color: #ff0040;
            animation: deathPulse 1s ease-in-out infinite alternate;
        }
        @keyframes deathPulse {
            0% { text-shadow: 0 0 20px rgba(255, 0, 64, 0.5); }
            100% { text-shadow: 0 0 60px rgba(255, 0, 64, 0.9), 0 0 100px rgba(255, 0, 64, 0.4); }
        }
        #death-screen .subtitle { color: rgba(255, 100, 100, 0.7); }
        .score-display { font-size: 1.5rem; color: #ff4080; margin: 20px 0; }

        #damage-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 80; opacity: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 64, 0.4) 100%);
            transition: opacity 0.2s;
        }

        #weapon {
            position: fixed; bottom: -20px; right: 50px; z-index: 60;
            pointer-events: none;
        }

        .muzzle-flash {
            position: fixed; bottom: 100px; right: 100px;
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle, #fff, #ff0, transparent);
            z-index: 70; pointer-events: none; opacity: 0;
        }

        #wave-announce {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; font-weight: 900; color: #0ff; z-index: 150;
            pointer-events: none; opacity: 0; letter-spacing: 5px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        #minimap {
            position: fixed; bottom: 20px; right: 20px; width: 150px; height: 150px;
            border: 2px solid rgba(0, 255, 255, 0.3); border-radius: 50%;
            background: rgba(0, 0, 0, 0.5); z-index: 50; pointer-events: none;
            overflow: hidden;
        }
        #minimap-canvas { width: 100%; height: 100%; border-radius: 50%; }

        #controls-hint {
            position: fixed; bottom: 20px; left: 20px; z-index: 50;
            font-size: 0.6rem; color: rgba(255, 255, 255, 0.3); letter-spacing: 1px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="crosshair"><div class="dot"></div></div>
    <div id="damage-overlay"></div>
    <div class="muzzle-flash" id="muzzleFlash"></div>

    <div id="hud" style="display:none;">
        <div class="hud-item">
            <div class="hud-label">HEALTH</div>
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div class="hud-item">
            <div class="hud-label">SCORE</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">WAVE</div>
            <div class="hud-value" id="wave">1</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">AMMO</div>
            <div class="hud-value" id="ammo">30</div>
        </div>
    </div>

    <div id="wave-announce"></div>

    <div id="minimap"><canvas id="minimap-canvas" width="150" height="150"></canvas></div>

    <div id="controls-hint">WASD Move | Mouse Look | Click Shoot | R Reload</div>

    <div id="start-screen">
        <div class="title">ROBOT PORTAL DEFENSE</div>
        <div class="subtitle">Protect the town from the robot invasion</div>
        <button class="btn" id="startBtn">START GAME</button>
    </div>

    <div id="death-screen">
        <div class="title">SYSTEM FAILURE</div>
        <div class="subtitle">The robots have breached your defenses</div>
        <div class="score-display" id="finalScore">Score: 0</div>
        <button class="btn" id="restartBtn">RETRY</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ============ AUDIO ENGINE ============
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const g = audioCtx.createGain();
        g.connect(audioCtx.destination);

        if (type === 'shoot') {
            const o = audioCtx.createOscillator();
            o.type = 'sawtooth'; o.frequency.setValueAtTime(200, now);
            o.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            g.gain.setValueAtTime(0.15, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            o.connect(g); o.start(now); o.stop(now + 0.15);
        } else if (type === 'hit') {
            const o = audioCtx.createOscillator();
            o.type = 'square'; o.frequency.setValueAtTime(800, now);
            o.frequency.exponentialRampToValueAtTime(200, now + 0.1);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            o.connect(g); o.start(now); o.stop(now + 0.12);
        } else if (type === 'explosion') {
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
            const src = audioCtx.createBufferSource();
            src.buffer = buffer;
            g.gain.setValueAtTime(0.3, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            src.connect(g); src.start(now);
        } else if (type === 'portal') {
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.setValueAtTime(100, now);
            o.frequency.exponentialRampToValueAtTime(600, now + 0.5);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            o.connect(g); o.start(now); o.stop(now + 0.6);
        } else if (type === 'meow') {
            const o = audioCtx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(800, now);
            o.frequency.linearRampToValueAtTime(600, now + 0.15);
            o.frequency.linearRampToValueAtTime(700, now + 0.25);
            o.frequency.linearRampToValueAtTime(400, now + 0.5);
            g.gain.setValueAtTime(0.06, now);
            g.gain.setValueAtTime(0.06, now + 0.1);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            o.connect(g); o.start(now); o.stop(now + 0.5);
        } else if (type === 'death') {
            for (let i = 0; i < 5; i++) {
                const o = audioCtx.createOscillator();
                const gg = audioCtx.createGain();
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(300 - i * 40, now + i * 0.2);
                o.frequency.exponentialRampToValueAtTime(30, now + i * 0.2 + 0.5);
                gg.gain.setValueAtTime(0.15, now + i * 0.2);
                gg.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.5);
                o.connect(gg); gg.connect(audioCtx.destination);
                o.start(now + i * 0.2); o.stop(now + i * 0.2 + 0.5);
            }
        } else if (type === 'reload') {
            const o = audioCtx.createOscillator();
            o.type = 'triangle'; o.frequency.setValueAtTime(400, now);
            o.frequency.setValueAtTime(600, now + 0.1);
            o.frequency.setValueAtTime(800, now + 0.2);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            o.connect(g); o.start(now); o.stop(now + 0.3);
        } else if (type === 'pickup') {
            const o = audioCtx.createOscillator();
            o.type = 'sine'; o.frequency.setValueAtTime(500, now);
            o.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
            g.gain.setValueAtTime(0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            o.connect(g); o.start(now); o.stop(now + 0.2);
        }
    }

    // ============ GAME STATE ============
    let scene, camera, renderer, clock;
    let playerHealth = 100, score = 0, wave = 1, ammo = 30, maxAmmo = 30;
    let isRunning = false, isDead = false;
    let robots = [], portals = [], bullets = [], particles = [], kitties = [];
    let buildings = [], trees = [];
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let velocity = new THREE.Vector3();
    let direction = new THREE.Vector3();
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    let isLocked = false;
    let shootCooldown = 0;
    let reloadTime = 0;
    let isReloading = false;
    let waveTimer = 0;
    let robotsToSpawn = 0;
    let spawnTimer = 0;
    let meowTimer = 0;
    let minimapCtx;

    // ============ INIT ============
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        clock = new THREE.Clock();
        minimapCtx = document.getElementById('minimap-canvas').getContext('2d');

        // Lights
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);

        const moonLight = new THREE.DirectionalLight(0x6688cc, 0.8);
        moonLight.position.set(50, 80, 30);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 200;
        moonLight.shadow.camera.left = -80;
        moonLight.shadow.camera.right = 80;
        moonLight.shadow.camera.top = 80;
        moonLight.shadow.camera.bottom = -80;
        scene.add(moonLight);

        // Hemisphere light for sky/ground color
        const hemi = new THREE.HemisphereLight(0x4466aa, 0x223322, 0.4);
        scene.add(hemi);

        createGround();
        createTown();
        createPortals();
        createKitties();
        createStreetLights();

        window.addEventListener('resize', onResize);
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('click', onMouseClick);
        document.addEventListener('pointerlockchange', onPointerLockChange);

        animate();
    }

    // ============ GROUND ============
    function createGround() {
        const groundGeo = new THREE.PlaneGeometry(200, 200, 50, 50);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x2a3a2a, roughness: 0.9, metalness: 0.1
        });
        // Add slight vertex displacement for terrain
        const pos = groundGeo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            pos.setZ(i, (Math.random() - 0.5) * 0.3);
        }
        groundGeo.computeVertexNormals();
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Roads
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333340, roughness: 0.8 });
        const road1 = new THREE.Mesh(new THREE.PlaneGeometry(200, 8), roadMat);
        road1.rotation.x = -Math.PI / 2; road1.position.y = 0.02;
        scene.add(road1);
        const road2 = new THREE.Mesh(new THREE.PlaneGeometry(8, 200), roadMat);
        road2.rotation.x = -Math.PI / 2; road2.position.y = 0.02;
        scene.add(road2);

        // Road markings
        const markMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.3 });
        for (let i = -90; i < 90; i += 8) {
            const mark = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.2), markMat);
            mark.rotation.x = -Math.PI / 2; mark.position.set(i, 0.03, 0);
            scene.add(mark);
            const mark2 = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 3), markMat);
            mark2.rotation.x = -Math.PI / 2; mark2.position.set(0, 0.03, i);
            scene.add(mark2);
        }
    }

    // ============ TOWN BUILDINGS ============
    function createTown() {
        const buildingColors = [0x4a5568, 0x5a6578, 0x3d4f5f, 0x485868, 0x556677, 0x607080];
        const windowMat = new THREE.MeshStandardMaterial({
            color: 0xffffaa, emissive: 0xffff44, emissiveIntensity: 0.5
        });

        const buildingPositions = [
            { x: 20, z: 20, w: 8, h: 15, d: 8 },
            { x: -20, z: 20, w: 10, h: 12, d: 7 },
            { x: 20, z: -20, w: 7, h: 20, d: 9 },
            { x: -20, z: -20, w: 9, h: 10, d: 8 },
            { x: 40, z: 5, w: 12, h: 18, d: 8 },
            { x: -40, z: 5, w: 8, h: 14, d: 10 },
            { x: 5, z: 40, w: 10, h: 16, d: 8 },
            { x: -5, z: -40, w: 7, h: 22, d: 7 },
            { x: 35, z: 35, w: 9, h: 11, d: 9 },
            { x: -35, z: -35, w: 11, h: 13, d: 8 },
            { x: 50, z: -15, w: 8, h: 17, d: 7 },
            { x: -50, z: 15, w: 10, h: 15, d: 9 },
            { x: 15, z: 50, w: 8, h: 19, d: 8 },
            { x: -15, z: -50, w: 9, h: 12, d: 10 },
            { x: 60, z: 30, w: 7, h: 14, d: 7 },
            { x: -60, z: -30, w: 10, h: 16, d: 8 },
            { x: 30, z: -45, w: 8, h: 13, d: 9 },
            { x: -30, z: 45, w: 9, h: 11, d: 7 },
        ];

        buildingPositions.forEach(bp => {
            const color = buildingColors[Math.floor(Math.random() * buildingColors.length)];
            const geo = new THREE.BoxGeometry(bp.w, bp.h, bp.d);
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.2 });
            const building = new THREE.Mesh(geo, mat);
            building.position.set(bp.x, bp.h / 2, bp.z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
            buildings.push({ mesh: building, x: bp.x, z: bp.z, w: bp.w, d: bp.d, h: bp.h });

            // Windows
            const winSize = 0.8;
            for (let wy = 2; wy < bp.h - 1; wy += 2.5) {
                for (let wx = -bp.w / 2 + 1.5; wx < bp.w / 2 - 0.5; wx += 2) {
                    if (Math.random() > 0.4) {
                        const winGeo = new THREE.PlaneGeometry(winSize, winSize * 1.3);
                        const winMat = windowMat.clone();
                        if (Math.random() > 0.5) {
                            winMat.emissive.setHex(0xff8844);
                            winMat.emissiveIntensity = 0.3 + Math.random() * 0.4;
                        }
                        const win = new THREE.Mesh(winGeo, winMat);
                        // Front face
                        win.position.set(bp.x + wx, wy, bp.z + bp.d / 2 + 0.05);
                        scene.add(win);
                        // Back face
                        const win2 = win.clone();
                        win2.position.z = bp.z - bp.d / 2 - 0.05;
                        win2.rotation.y = Math.PI;
                        scene.add(win2);
                    }
                }
            }

            // Roof detail
            const roofGeo = new THREE.BoxGeometry(bp.w + 0.5, 0.5, bp.d + 0.5);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.8 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(bp.x, bp.h + 0.25, bp.z);
            roof.castShadow = true;
            scene.add(roof);
        });

        // Trees
        const treeTrunkMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.9 });
        const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x2a5a2a, roughness: 0.8 });

        const treePositions = [
            { x: 12, z: 0 }, { x: -12, z: 0 }, { x: 0, z: 12 }, { x: 0, z: -12 },
            { x: 28, z: 15 }, { x: -28, z: -15 }, { x: 15, z: -28 }, { x: -15, z: 28 },
            { x: 45, z: 0 }, { x: -45, z: 0 }, { x: 0, z: 45 }, { x: 0, z: -45 },
            { x: 55, z: 20 }, { x: -55, z: -20 }, { x: 20, z: 55 }, { x: -20, z: -55 },
        ];

        treePositions.forEach(tp => {
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.4, 3, 6), treeTrunkMat
            );
            trunk.position.set(tp.x, 1.5, tp.z);
            trunk.castShadow = true;
            scene.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.SphereGeometry(2, 8, 6), treeLeafMat
            );
            leaves.position.set(tp.x, 4, tp.z);
            leaves.castShadow = true;
            scene.add(leaves);
            trees.push({ x: tp.x, z: tp.z, r: 2 });
        });

        // Houses (smaller, scattered)
        const housePositions = [
            { x: 70, z: 50 }, { x: -70, z: 50 }, { x: 70, z: -50 }, { x: -70, z: -50 },
            { x: 80, z: 0 }, { x: -80, z: 0 }, { x: 0, z: 70 }, { x: 0, z: -70 },
        ];

        housePositions.forEach(hp => {
            const houseColor = [0x8B7355, 0xA0926B, 0x9B8B7B, 0x7B6B5B][Math.floor(Math.random() * 4)];
            // Walls
            const wallGeo = new THREE.BoxGeometry(6, 5, 6);
            const wallMat = new THREE.MeshStandardMaterial({ color: houseColor, roughness: 0.8 });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.position.set(hp.x, 2.5, hp.z);
            walls.castShadow = true; walls.receiveShadow = true;
            scene.add(walls);

            // Roof (pyramid)
            const roofGeo = new THREE.ConeGeometry(5, 3, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8B0000, roughness: 0.7 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(hp.x, 6.5, hp.z);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            scene.add(roof);

            // Door
            const doorGeo = new THREE.PlaneGeometry(1.2, 2.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x4a3020 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(hp.x, 1.1, hp.z + 3.05);
            scene.add(door);

            // Window
            const hWinGeo = new THREE.PlaneGeometry(1, 1);
            const hWinMat = new THREE.MeshStandardMaterial({
                color: 0xffffaa, emissive: 0xffaa44, emissiveIntensity: 0.4
            });
            const hWin = new THREE.Mesh(hWinGeo, hWinMat);
            hWin.position.set(hp.x + 1.5, 3, hp.z + 3.05);
            scene.add(hWin);
        });
    }

    // ============ STREET LIGHTS ============
    function createStreetLights() {
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
        const lightMat = new THREE.MeshStandardMaterial({
            color: 0xffffcc, emissive: 0xffaa44, emissiveIntensity: 1
        });

    // ============ SPAWN ROBOT ============
    function spawnRobot() {
        const portalIndex = Math.floor(Math.random() * portals.length);
        const portal = portals[portalIndex];
        const hue = Math.random();
        const color = new THREE.Color().setHSL(hue, 0.7, 0.5);

        const robotData = createRobotMesh(color);
        robotData.group.position.set(portal.x, 0, portal.z);
        scene.add(robotData.group);

        // Spawn animation
        robotData.group.scale.set(0, 0, 0);

        robots.push({
            ...robotData,
            x: portal.x, z: portal.z,
            speed: 2 + wave * 0.3 + Math.random() * 1.5,
            health: 2 + Math.floor(wave / 3),
            spawnAnim: 1.0,
            walkCycle: Math.random() * Math.PI * 2
        });

        playSound('portal');
    }

    // ============ SHOOTING ============
    function shoot() {
        if (ammo <= 0 || isReloading || shootCooldown > 0 || !isRunning || isDead) return;

        ammo--;
        shootCooldown = 0.15;
        document.getElementById('ammo').textContent = ammo;
        playSound('shoot');

        // Muzzle flash
        const flash = document.getElementById('muzzleFlash');
        flash.style.opacity = '1';
        setTimeout(() => flash.style.opacity = '0', 50);

        // Raycast
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

        // Check robot hits
        let hit = false;
        for (let i = robots.length - 1; i >= 0; i--) {
            const robot = robots[i];
            if (robot.spawnAnim > 0.5) continue;

            const robotMeshes = [];
            robot.group.traverse(child => {
                if (child.isMesh) robotMeshes.push(child);
            });

            const intersects = raycaster.intersectObjects(robotMeshes);
            if (intersects.length > 0 && intersects[0].distance < 100) {
                robot.health--;
                hit = true;
                playSound('hit');

                // Hit flash
                robot.torso.material.emissive.setHex(0xff0000);
                robot.torso.material.emissiveIntensity = 1;
                setTimeout(() => {
                    if (robot.torso) {
                        robot.torso.material.emissive.setHex(0x000000);
                        robot.torso.material.emissiveIntensity = 0;
                    }
                }, 100);

                if (robot.health <= 0) {
                    // Death explosion
                    createExplosion(robot.x, 1.5, robot.z, robot.group.children[0].material.color);
                    scene.remove(robot.group);
                    robots.splice(i, 1);
                    score += 100;
                    document.getElementById('score').textContent = score;
                    playSound('explosion');
                }
                break;
            }
        }

        // Bullet tracer
        const bulletDir = raycaster.ray.direction.clone();
        const bulletGeo = new THREE.SphereGeometry(0.05, 4, 4);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const bullet = new THREE.Mesh(bulletGeo, bulletMat);
        bullet.position.copy(camera.position);
        scene.add(bullet);

        const tracerLight = new THREE.PointLight(0x00ffff, 1, 5);
        bullet.add(tracerLight);

        bullets.push({
            mesh: bullet,
            velocity: bulletDir.multiplyScalar(80),
            life: 1.0
        });

        if (ammo === 0) reload();
    }

    function reload() {
        if (isReloading || ammo === maxAmmo) return;
        isReloading = true;
        reloadTime = 1.5;
        playSound('reload');
    }

    // ============ EXPLOSIONS ============
    function createExplosion(x, y, z, color) {
        for (let i = 0; i < 20; i++) {
            const geo = new THREE.SphereGeometry(0.1 + Math.random() * 0.2, 6, 6);
            const mat = new THREE.MeshBasicMaterial({
                color: color || 0xff4400, transparent: true, opacity: 1
            });
            const particle = new THREE.Mesh(geo, mat);
            particle.position.set(x, y, z);
            scene.add(particle);

            particles.push({
                mesh: particle,
                vx: (Math.random() - 0.5) * 8,
                vy: Math.random() * 6,
                vz: (Math.random() - 0.5) * 8,
                life: 1.0
            });
        }

        // Explosion light
        const expLight = new THREE.PointLight(color || 0xff4400, 3, 20);
        expLight.position.set(x, y, z);
        scene.add(expLight);
        setTimeout(() => scene.remove(expLight), 300);
    }

    // ============ UPDATE KITTIES ============
    function updateKitties(dt) {
        meowTimer -= dt;
        if (meowTimer <= 0) {
            playSound('meow');
            meowTimer = 5 + Math.random() * 10;
        }

        kitties.forEach(k => {
            k.turnTimer -= dt;
            if (k.turnTimer <= 0) {
                k.vx = (Math.random() - 0.5) * k.speed;
                k.vz = (Math.random() - 0.5) * k.speed;
                k.turnTimer = 2 + Math.random() * 4;

                // Face direction of movement
                if (Math.abs(k.vx) > 0.1 || Math.abs(k.vz) > 0.1) {
                    k.group.rotation.y = Math.atan2(k.vx, k.vz);
                }
            }

            // Keep kitties in background area
            const dist = Math.sqrt(k.group.position.x ** 2 + k.group.position.z ** 2);
            if (dist < 25) {
                const angle = Math.atan2(k.group.position.z, k.group.position.x);
                k.vx = -Math.cos(angle) * k.speed;
                k.vz = -Math.sin(angle) * k.speed;
            }
            if (dist > 75) {
                const angle = Math.atan2(k.group.position.z, k.group.position.x);
                k.vx = -Math.cos(angle) * k.speed;
                k.vz = -Math.sin(angle) * k.speed;
            }

            k.group.position.x += k.vx * dt;
            k.group.position.z += k.vz * dt;

            // Bobbing walk animation
            k.body.position.y = 0.4 + Math.sin(clock.elapsedTime * 5 + k.group.id) * 0.05;

            // Tail wag
            k.tail.rotation.z = Math.sin(clock.elapsedTime * 3) * 0.3;

            // Head bob
            k.head.position.y = 0.7 + Math.sin(clock.elapsedTime * 4 + k.group.id + 1) * 0.03;
        });
    }

    // ============ UPDATE PORTALS ============
    function updatePortals(dt) {
        portals.forEach(p => {
            p.angle += dt * 2;
            p.group.rotation.z = p.angle;
            p.ring.rotation.x = Math.sin(p.angle * 0.5) * 0.3;
            p.inner.material.opacity = 0.4 + Math.sin(p.angle * 2) * 0.2;
            p.core.scale.setScalar(0.8 + Math.sin(p.angle * 3) * 0.2);
            p.light.intensity = 0.8 + Math.sin(p.angle * 2) * 0.4;
        });
    }

    // ============ UPDATE ROBOTS ============
    function updateRobots(dt) {
        robots.forEach(robot => {
            // Spawn animation
            if (robot.spawnAnim > 0) {
                robot.spawnAnim -= dt * 2;
                const s = 1 - robot.spawnAnim;
                robot.group.scale.set(s, s, s);
                robot.group.position.y = (1 - s) * 3;
                return;
            }

            // Walk toward player
            const dx = camera.position.x - robot.x;
            const dz = camera.position.z - robot.z;
            const dist = Math.sqrt(dx * dx + dz * dz);

            if (dist > 0) {
                const moveX = (dx / dist) * robot.speed * dt;
                const moveZ = (dz / dist) * robot.speed * dt;
                robot.x += moveX;
                robot.z += moveZ;
                robot.group.position.x = robot.x;
                robot.group.position.z = robot.z;

                // Face player
                robot.group.rotation.y = Math.atan2(dx, dz);
            }

            // Walk animation
            robot.walkCycle += dt * robot.speed * 3;
            const legSwing = Math.sin(robot.walkCycle) * 0.4;
            robot.legL.rotation.x = legSwing;
            robot.legR.rotation.x = -legSwing;
            robot.armL.rotation.x = -legSwing * 0.5;
            robot.armR.rotation.x = legSwing * 0.5;

            // Body bob
            robot.torso.position.y = 1.8 + Math.abs(Math.sin(robot.walkCycle)) * 0.1;

            // Head bob
            robot.head.position.y = 2.8 + Math.sin(robot.walkCycle * 0.5) * 0.05;

            // Antenna blink
            robot.antennaTip.material.color.setHex(
                Math.sin(clock.elapsedTime * 5) > 0 ? 0xff4444 : 0xff8888
            );

            // Check if robot reached player
            if (dist < 2) {
                playerHealth -= 10;
                document.getElementById('health-bar').style.width = playerHealth + '%';
                document.getElementById('damage-overlay').style.opacity = '0.5';
                setTimeout(() => document.getElementById('damage-overlay').style.opacity = '0', 300);
                playSound('explosion');

                // Knock robot back
                robot.x -= (dx / dist) * 5;
                robot.z -= (dz / dist) * 5;

                if (playerHealth <= 0) {
                    die();
                }
            }
        });
    }

    // ============ UPDATE BULLETS ============
    function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.mesh.position.add(b.velocity.clone().multiplyScalar(dt));
            b.life -= dt;
            if (b.life <= 0) {
                scene.remove(b.mesh);
                bullets.splice(i, 1);
            }
        }
    }

    // ============ UPDATE PARTICLES ============
    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.mesh.position.x += p.vx * dt;
            p.mesh.position.y += p.vy * dt;
            p.mesh.position.z += p.vz * dt;
            p.vy -= 10 * dt; // gravity
            p.life -= dt;
            p.mesh.material.opacity = p.life;
            p.mesh.scale.setScalar(p.life);

            if (p.life <= 0) {
                scene.remove(p.mesh);
                particles.splice(i, 1);
            }
        }
    }

    // ============ WAVE SYSTEM ============
    function updateWaves(dt) {
        if (!isRunning || isDead) return;

        robotsToSpawn = Math.min(5 + wave * 3, 30);
        spawnTimer -= dt;

        if (spawnTimer <= 0 && robots.length < robotsToSpawn) {
            spawnRobot();
            spawnTimer = Math.max(0.5, 2 - wave * 0.1);
        }

        // Check if wave is complete
        if (robots.length === 0 && robotsToSpawn > 0) {
            const allSpawned = score > 0;
            // Simple wave progression based on score milestones
            if (score > wave * 500) {
                wave++;
                document.getElementById('wave').textContent = wave;
                announceWave();

                // Health boost between waves
                playerHealth = Math.min(100, playerHealth + 20);
                document.getElementById('health-bar').style.width = playerHealth + '%';
                ammo = maxAmmo;
                document.getElementById('ammo').textContent = ammo;
                isReloading = false;
            }
        }
    }

    function announceWave() {
        const el = document.getElementById('wave-announce');
        el.textContent = 'WAVE ' + wave;
        el.style.opacity = '1';
        el.style.transition = 'none';

        setTimeout(() => {
            el.style.transition = 'opacity 1.5s';
            el.style.opacity = '0';
        }, 1500);
    }

    // ============ DEATH ============
    function die() {
        isDead = true;
        isRunning = false;
        playSound('death');

        document.exitPointerLock();
        document.getElementById('death-screen').style.display = 'flex';
        document.getElementById('finalScore').textContent = 'Score: ' + score;
        document.getElementById('hud').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('controls-hint').style.display = 'none';
        document.body.classList.remove('game-active');

        // Death atmosphere - screen shake effect via CSS
        document.body.style.animation = 'none';
    }

    // ============ PLAYER MOVEMENT ============
    function updatePlayer(dt) {
        if (!isRunning || isDead) return;

        velocity.x -= velocity.x * 8.0 * dt;
        velocity.z -= velocity.z * 8.0 * dt;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        const speed = 15;
        if (moveForward || moveBackward) velocity.z -= direction.z * speed * dt;
        if (moveLeft || moveRight) velocity.x -= direction.x * speed * dt;

        // Move relative to camera look direction
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        forward.y = 0; forward.normalize();
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        right.y = 0; right.normalize();

        camera.position.add(forward.multiplyScalar(-velocity.z * dt * 5));
        camera.position.add(right.multiplyScalar(-velocity.x * dt * 5));

        // Keep player in bounds
        camera.position.x = Math.max(-70, Math.min(70, camera.position.x));
        camera.position.z = Math.max(-70, Math.min(70, camera.position.z));
        camera.position.y = 2;

        // Shooting cooldown
        if (shootCooldown > 0) shootCooldown -= dt;

        // Reload
        if (isReloading) {
            reloadTime -= dt;
            if (reloadTime <= 0) {
                ammo = maxAmmo;
                isReloading = false;
                document.getElementById('ammo').textContent = ammo;
            }
        }
    }

    // ============ MINIMAP ============
    function updateMinimap() {
        const ctx = minimapCtx;
        const w = 150, h = 150;
        ctx.clearRect(0, 0, w, h);

        // Background
        ctx.fillStyle = 'rgba(0, 20, 40, 0.8)';
        ctx.beginPath();
        ctx.arc(75, 75, 73, 0, Math.PI * 2);
        ctx.fill();

        const scale = 1.2;
        const cx = 75, cy = 75;

        // Buildings
        ctx.fillStyle = 'rgba(100, 120, 140, 0.5)';
        buildings.forEach(b => {
            const bx = cx + (b.x - camera.position.x) * scale;
            const bz = cy + (b.z - camera.position.z) * scale;
            if (bx > -10 && bx < 160 && bz > -10 && bz < 160) {
                ctx.fillRect(bx - b.w * scale / 2, bz - b.d * scale / 2, b.w * scale, b.d * scale);
            }
        });

        // Portals
        ctx.fillStyle = '#8800ff';
        portals.forEach(p => {
            const px = cx + (p.x - camera.position.x) * scale;
            const pz = cy + (p.z - camera.position.z) * scale;
            if (px > 0 && px < 150 && pz > 0 && pz < 150) {
                ctx.beginPath();
                ctx.arc(px, pz, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Robots
        ctx.fillStyle = '#ff4444';
        robots.forEach(r => {
            const rx = cx + (r.x - camera.position.x) * scale;
            const rz = cy + (r.z - camera.position.z) * scale;
            if (rx > 0 && rx < 150 && rz > 0 && rz < 150) {
                ctx.beginPath();
                ctx.arc(rx, rz, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Kitties
        ctx.fillStyle = '#ffaa44';
        kitties.forEach(k => {
            const kx = cx + (k.group.position.x - camera.position.x) * scale;
            const kz = cy + (k.group.position.z - camera.position.z) * scale;
            if (kx > 0 && kx < 150 && kz > 0 && kz < 150) {
                ctx.fillRect(kx - 1, kz - 1, 2, 2);
            }
        });

        // Player (center)
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();

        // Player direction
        const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + dir.x * 12, cy + dir.z * 12);
        ctx.stroke();
    }

    // ============ ANIMATION LOOP ============
    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        if (isRunning && !isDead) {
            updatePlayer(dt);
            updateRobots(dt);
            updateBullets(dt);
            updateParticles(dt);
            updatePortals(dt);
            updateKitties(dt);
            updateWaves(dt);
            updateMinimap();
        }

        renderer.render(scene, camera);
    }

    // ============ EVENT HANDLERS ============
    function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onKeyDown(e) {
        switch (e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyD': moveRight = true; break;
            case 'KeyR': reload(); break;
        }
    }

    function onKeyUp(e) {
        switch (e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyD': moveRight = false; break;
        }
    }

    function onMouseMove(e) {
        if (!isLocked) return;
        const sensitivity = 0.002;
        euler.setFromQuaternion(camera.quaternion);
        euler.y -= e.movementX * sensitivity;
        euler.x -= e.movementY * sensitivity;
        euler.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, euler.x));
        camera.quaternion.setFromEuler(euler);
    }

    let mouseDown = false;
    function onMouseClick(e) {
        if (e.target.id === 'startBtn' || e.target.id === 'restartBtn') return;
        if (!isLocked) {
            renderer.domElement.requestPointerLock();
            return;
        }
        if (e.button === 0) {
            shoot();
        }
    }

    function onPointerLockChange() {
        isLocked = document.pointerLockElement === renderer.domElement;
    }

    // ============ START / RESTART ============
    function startGame() {
        initAudio();
        playerHealth = 100; score = 0; wave = 1; ammo = maxAmmo;
        isRunning = true; isDead = false;
        robotsToSpawn = 8; spawnTimer = 1;

        // Clear old entities
        robots.forEach(r => scene.remove(r.group));
        bullets.forEach(b => scene.remove(b.mesh));
        particles.forEach(p => scene.remove(p.mesh));
        robots = []; bullets = []; particles = [];

        camera.position.set(0, 2, 0);
        euler.set(0, 0, 0);
        camera.quaternion.setFromEuler(euler);

        document.getElementById('health-bar').style.width = '100%';
        document.getElementById('score').textContent = '0';
        document.getElementById('wave').textContent = '1';
        document.getElementById('ammo').textContent = '30';
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('death-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('crosshair').style.display = 'block';
        document.getElementById('controls-hint').style.display = 'block';
        document.body.classList.add('game-active');

        renderer.domElement.requestPointerLock();
        announceWave();
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    // ============ GO ============
    init();
    </script>
</body>
</html>
