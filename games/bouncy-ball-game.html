<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncy Ball Adventure</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FA 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4/3;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #87CEEB, #E0F7FA);
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #FFD700;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        button {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #4CAF50, #8BC34A);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }
            
            p {
                font-size: 16px;
            }
            
            button {
                padding: 12px 30px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div class="score-board">Distance: <span id="distance">0</span>m</div>
        </div>

        <div id="start-screen">
            <h1>BOUNCY BALL ADVENTURE</h1>
            <p>Hold down click/tap to move forward. Release to stop. Jump over the holes in the grass!</p>
            <button id="start-btn">PLAY NOW</button>
            <div class="controls-hint">Hold click/tap to move, release to stop</div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>You fell into a hole! You traveled <span id="final-distance">0</span> meters.</p>
            <button id="restart-btn">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        class BouncyBallGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                this.ball = {
                    x: 100,
                    y: 300,
                    radius: 15,
                    vx: 0,
                    vy: 0,
                    gravity: 0.8,
                    jumpStrength: -15,
                    isBouncing: false
                };
                
                this.groundY = this.height - 100;
                this.groundWidth = 2000;
                this.groundHoles = [];
                this.cameraX = 0;
                this.gameSpeed = 5;
                this.distance = 0;
                
                this.isMoving = false;
                this.gameRunning = false;
                this.animationId = null;
                
                this.init();
            }
            
            init() {
                this.bindEvents();
                this.resetGame();
                this.draw();
            }
            
            bindEvents() {
                document.getElementById('start-btn').addEventListener('click', () => this.startGame());
                document.getElementById('restart-btn').addEventListener('click', () => this.startGame());
                
                // Mouse events
                this.canvas.addEventListener('mousedown', () => this.startMoving());
                this.canvas.addEventListener('mouseup', () => this.stopMoving());
                this.canvas.addEventListener('mouseleave', () => this.stopMoving());
                
                // Touch events
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.startMoving();
                });
                this.canvas.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    this.stopMoving();
                });
            }
            
            resetGame() {
                this.ball = {
                    x: 100,
                    y: this.groundY - this.ball.radius,
                    radius: 15,
                    vx: 0,
                    vy: 0,
                    gravity: 0.8,
                    jumpStrength: -15,
                    isBouncing: true
                };
                
                this.cameraX = 0;
                this.gameSpeed = 5;
                this.distance = 0;
                this.generateGroundHoles();
                this.updateUI();
            }
            
            generateGroundHoles() {
                this.groundHoles = [];
                const holeCount = 20;
                const holeWidth = 60;
                
                for (let i = 0; i < holeCount; i++) {
                    this.groundHoles.push({
                        x: 400 + i * 150 + Math.random() * 50,
                        width: holeWidth + Math.random() * 30
                    });
                }
            }
            
            startGame() {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                this.resetGame();
                this.gameRunning = true;
                this.gameLoop();
            }
            
            startMoving() {
                if (this.gameRunning) {
                    this.isMoving = true;
                }
            }
            
            stopMoving() {
                this.isMoving = false;
            }
            
            gameOver() {
                this.gameRunning = false;
                cancelAnimationFrame(this.animationId);
                document.getElementById('final-distance').textContent = Math.floor(this.distance);
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
            
            update() {
                if (!this.gameRunning) return;
                
                // Ball physics - 40% slower bounces (lower gravity)
                // Using 0.6 for gravity to slow down the bouncing frequency
                this.ball.vy += this.ball.gravity * 0.6;
                this.ball.y += this.ball.vy;
                
                // Check if ball is over a hole
                let isOverHole = false;
                for (const hole of this.groundHoles) {
                    if (this.ball.x > hole.x && this.ball.x < hole.x + hole.width) {
                        isOverHole = true;
                        break;
                    }
                }
                
                // Ball bouncing on ground (only if not over a hole)
                // Adjust jump strength to maintain same bounce height with lower gravity
                // Jump strength should be proportional to sqrt(gravity) to maintain same height
                if (!isOverHole && this.ball.y + this.ball.radius > this.groundY) {
                    this.ball.y = this.groundY - this.ball.radius;
                    // To maintain same height with 60% gravity, jump strength should be sqrt(0.6) ≈ 0.775 of original
                    this.ball.vy = this.ball.jumpStrength * 0.775;
                }
                
                // Check if ball fell too far (game over)
                if (this.ball.y > this.height + this.ball.radius) {
                    this.gameOver();
                    return;
                }
                
                // Move ball forward when moving - 20% slower
                if (this.isMoving) {
                    this.ball.x += this.gameSpeed * 0.8;
                    this.cameraX += this.gameSpeed * 0.8;
                    this.distance += this.gameSpeed * 0.8 * 0.05;
                    
                    // Generate new holes as we move
                    const lastHole = this.groundHoles[this.groundHoles.length - 1];
                    if (lastHole.x < this.cameraX + this.width + 200) {
                        const newHoleX = lastHole.x + 150 + Math.random() * 100;
                        this.groundHoles.push({
                            x: newHoleX,
                            width: 60 + Math.random() * 30
                        });
                    }
                    
                    // Remove old holes
                    if (this.groundHoles.length > 30) {
                        this.groundHoles.shift();
                    }
                }
                
                this.updateUI();
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                
                this.ctx.save();
                this.ctx.translate(-this.cameraX, 0);
                
                // Draw ground
                this.ctx.fillStyle = '#4CAF50';
                this.ctx.fillRect(this.cameraX, this.groundY, this.width, this.height - this.groundY);
                
                // Draw holes in ground
                this.ctx.fillStyle = '#8D6E63'; // Brown for holes
                for (const hole of this.groundHoles) {
                    // Only draw holes that are visible
                    if (hole.x + hole.width > this.cameraX && hole.x < this.cameraX + this.width) {
                        this.ctx.fillRect(hole.x, this.groundY, hole.width, this.height - this.groundY);
                    }
                }
                
                // Draw grass details
                this.ctx.fillStyle = '#388E3C';
                for (let i = Math.floor(this.cameraX / 20) * 20; i < this.cameraX + this.width; i += 20) {
                    this.ctx.fillRect(i, this.groundY - 5, 4, 5);
                }
                
                // Draw ball
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x, this.ball.y, this.ball.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = '#FF6B6B';
                this.ctx.fill();
                this.ctx.strokeStyle = '#D32F2F';
                this.ctx.lineWidth = 2;
                this.ctx.stroke();
                this.ctx.closePath();
                
                // Draw ball details (shine)
                this.ctx.beginPath();
                this.ctx.arc(this.ball.x - 5, this.ball.y - 5, 3, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.fill();
                this.ctx.closePath();
                
                this.ctx.restore();
            }
            
            updateUI() {
                document.getElementById('distance').textContent = Math.floor(this.distance);
            }
            
            gameLoop() {
                if (!this.gameRunning) return;
                
                this.update();
                this.draw();
                this.animationId = requestAnimationFrame(() => this.gameLoop());
            }
        }
        
        // Initialize game when page loads
        window.addEventListener('load', () => {
            new BouncyBallGame();
        });
    </script>
</body>
</html>
